services:
  postgres:
    image: postgres:17-alpine
    container_name: caixa-postgres
    environment:
      POSTGRES_DB: caixa
      POSTGRES_USER: caixa
      # Senha so via ambiente. Em dev, defina em local.ps1 (gitignored).
      POSTGRES_PASSWORD: ${CAIXA_BD_SENHA:?defina CAIXA_BD_SENHA}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - caixa-dados:/var/lib/postgresql/data
      # Aplicado apenas na primeira criacao do volume, em ordem alfabetica.
      - ../migracoes:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caixa -d caixa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caixa-dados:
